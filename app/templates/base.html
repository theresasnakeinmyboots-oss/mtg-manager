<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TheJar{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/keyrune@latest/css/keyrune.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='mana.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='card-effects.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='MultiSelect.css') }}">
    <script src="{{ url_for('static', filename='MultiSelect.js') }}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <img src="{{ url_for('static', filename='favicon.png') }}" class="nav-brand-icon" alt="">
                TheJar
            </a>
            <ul class="nav-menu">
                <li><a href="/collection" class="nav-link">Browse</a></li>
                <li><a href="/collections" class="nav-link">Collections</a></li>
                <li><a href="/sets" class="nav-link">Set View</a></li>
                <li><a href="/decks" class="nav-link">Decks</a></li>
                <li><a href="#" class="nav-link disabled">Simulation</a></li>
                <li><a href="/admin" class="nav-link">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 TheJar</p>
    </footer>
    <script src="{{ url_for('static', filename='card-effects.js') }}"></script>
    <script src="{{ url_for('static', filename='deck-menu.js') }}"></script>
</body>
</html>
