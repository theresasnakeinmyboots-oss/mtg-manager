{% extends 'base.html' %}
{% block title %}New Deck - TheJar{% endblock %}

{% block content %}
<div class="deck-form-page">
    <h1>New Deck</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="POST" class="deck-form">
        <label>
            Name
            <input type="text" name="name" value="{{ form.get('name','') }}" required autofocus>
        </label>
        <label>
            Format
            <select name="format" id="formatSelect" required>
                <option value="">Select format…</option>
                {% for key, label in formats.items() %}
                <option value="{{ key }}" {% if form.get('format') == key %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="sealedCollectionRow" style="display:none;">
            <label>
                Autofill from collection <span style="font-weight:400;color:var(--text-secondary);">(optional)</span>
                <select name="sealed_collection_id" id="sealedCollectionSelect">
                    <option value="">— none, start empty —</option>
                    {% for c in collections %}
                    <option value="{{ c.id }}" {% if form.get('sealed_collection_id')|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>
                    {% endfor %}
                </select>
            </label>
        </div>
        <fieldset class="deck-kind-choice">
            <legend>Deck type</legend>
            <label class="deck-kind-option">
                <input type="radio" name="kind" value="list" {% if form.get('kind','list') != 'physical' %}checked{% endif %}>
                <span><strong>List</strong> — a theoretical decklist; cards are tracked by name, you don't need to own them</span>
            </label>
            <label class="deck-kind-option">
                <input type="radio" name="kind" value="physical" {% if form.get('kind') == 'physical' %}checked{% endif %}>
                <span><strong>Physical</strong> — built from specific owned cards, stored separately from your collection</span>
            </label>
        </fieldset>
        <label>
            Description <span style="font-weight:400;color:var(--text-secondary);">(optional)</span>
            <textarea name="description" rows="3">{{ form.get('description','') }}</textarea>
        </label>
        <div class="deck-form-actions">
            <a href="/decks" class="btn btn-secondary btn-sm">Cancel</a>
            <button type="submit" class="btn btn-primary btn-sm">Create deck</button>
        </div>
    </form>
</div>
<script>
const formatSelect = document.getElementById('formatSelect');
const sealedRow = document.getElementById('sealedCollectionRow');
function toggleSealedRow() {
    sealedRow.style.display = formatSelect.value === 'sealed' ? '' : 'none';
}
formatSelect.addEventListener('change', toggleSealedRow);
toggleSealedRow();
</script>
{% endblock %}
