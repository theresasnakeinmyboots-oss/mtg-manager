version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mtg-manager-app
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - mtg-data:/data
    environment:
      - DATA_DIR=/data
      - FLASK_DEBUG=false
    restart: unless-stopped

volumes:
  mtg-data:
    driver: local
