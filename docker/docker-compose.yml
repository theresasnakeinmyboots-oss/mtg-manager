version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mtg-manager-app
    expose:
      - "8001"
    volumes:
      - mtg-data:/data
    environment:
      - DATA_DIR=/data
      - FLASK_DEBUG=false
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mtg-manager-nginx
    ports:
      - "5002:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mtg-data:
    driver: local
